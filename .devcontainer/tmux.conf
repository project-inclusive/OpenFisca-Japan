# Always launch panes with bash, regardless of the exec'd process's $SHELL or the
# user's /etc/passwd shell field (which defaults to /bin/sh via `useradd` otherwise).
set -g default-shell /bin/bash

# Enable mouse interactions, including scrolling through pane history with the wheel.
set -g mouse on
set -g set-clipboard on

set -g default-terminal "tmux-256color"
set -as terminal-overrides ',*:Tc'

# Dev Containers が仕込む docker 認証ヘルパー(credsStore: dev-containers-*)は
# VS Code アタッチ時のみ有効で、tmux/SSH 経由の docker では失敗する
# （`docker compose up --build` 等が "error getting credentials - err: exit status 255"）。
# tmux セッション内では専用の DOCKER_CONFIG を使い、公開イメージを匿名取得できるようにする。
# （VS Code が使う ~/.docker/config.json には触れない）
set-environment -g DOCKER_CONFIG "/home/user/.docker-tmux"
