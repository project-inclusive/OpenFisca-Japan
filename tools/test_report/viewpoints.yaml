# 観点・条件の正本。対象の期待条件とテストとの対応は別に管理する。
version: 1
viewpoints:
  input:
    name: 入力
    description: 値の変換、未回答と入力制約
    conditions:
      - normal
      - boundary
      - empty
      - invalid
      - ime
      - mobile
  transition:
    name: 遷移
    description: 画面・質問間の移動と状態の復元
    conditions:
      - forward
      - back
      - restore
      - save
      - member
      - consent
  communication:
    name: 通信
    description: 送信と失敗時の状態
    conditions:
      - success
      - http500
      - network
      - absent
      - retry
      - environment
  a11y:
    name: アクセシビリティ
    description: 操作と意味のあるラベル
    conditions:
      - keyboard
      - label
      - focus
      - audit
  display:
    name: 表示
    description: 結果の有無と画面幅、データによる表示分岐
    conditions:
      - present
      - absent
      - viewport
      - region
      - url
      - range
      - unit
      - hiv
  compatibility:
    name: 互換
    description: ブラウザーと端末での smoke
    conditions:
      - smoke
  sharing:
    name: 共有
    description: 共有データの互換性と共有操作
    conditions:
      - roundtrip
      - legacy
      - invalid
      - defaults
      - unknown
      - copy
      - qr
      - image
  state:
    name: 状態
    description: 世帯変換と進捗の算出
    conditions:
      - conversion
      - progress
      - optional
stages:
  - id: unit
    name: 単体
    projects:
      - unit
    list: unit.list.json
    result: unit.results.json
    command:
      - node_modules/.bin/vitest
      - list
      - --no-static-parse
      - --includeTaskLocation
      - --json
    run: npm run test -- --reporter=json --outputFile=../tmp/test-report/unit.results.json
  - id: ui
    name: コンポーネント（story・Browser Mode）
    projects:
      - storybook
      - browser
    list: ui.list.json
    result: ui.results.json
    command:
      - node_modules/.bin/vitest
      - list
      - --config
      - vitest.browser.config.mts
      - --no-static-parse
      - --includeTaskLocation
      - --json
    run: npm run test:ui -- --reporter=json --outputFile=../tmp/test-report/ui.results.json
  - id: e2e
    name: E2E（モック応答の smoke）
    projects:
      - chromium
      - firefox
      - webkit
      - mobile-safari
      - mobile-chromium
    list: e2e.list.json
    result: e2e.results.json
    command:
      - node_modules/.bin/playwright
      - test
      - --list
      - --reporter=json
    run:
      PLAYWRIGHT_JSON_OUTPUT_NAME=../tmp/test-report/e2e.results.json npm run test:e2e
      -- --reporter=json
applicability:
  route:
    - transition:forward
    - transition:back
    - a11y:keyboard
  question:
    - state:conversion
    - transition:forward
    - transition:back
  template:
    - input:normal
    - input:boundary
    - input:empty
    - input:invalid
    - input:ime
    - input:mobile
    - transition:restore
    - a11y:keyboard
    - a11y:label
    - a11y:focus
    - a11y:audit
  mode:
    - transition:forward
    - transition:back
    - transition:save
    - transition:member
  result:
    - display:present
    - display:absent
    - display:region
    - display:url
    - display:range
    - display:unit
    - display:hiv
    - a11y:keyboard
    - a11y:audit
  environment:
    - communication:environment
  error:
    - display:present
    - transition:back
    - a11y:keyboard
    - a11y:focus
    - a11y:audit
  device:
    - compatibility:smoke
  share:
    - sharing:roundtrip
    - sharing:legacy
    - sharing:invalid
    - sharing:defaults
    - sharing:unknown
    - sharing:copy
    - sharing:qr
    - sharing:image
  file:
    - display:present
manual_targets:
  - id: environment:other
    group: environment
    source: src/hooks/calculate.ts
    reason: else 分岐は列挙値を持たないため、比較対象以外を一つの同値クラスとして手で定義する。
  - id: share:compact-raw
    group: share
    source: src/components/result/shareLink.ts
    reason: 生配列とdeflateの選択はデータ長に依存するため、意味上の形式を手で定義する。
  - id: share:compact-deflate
    group: share
    source: src/components/result/shareLink.ts
    reason: 圧縮形式は構文上の独立した識別子を持たないため手で定義する。
  - id: share:legacy-object
    group: share
    source: src/components/result/shareLink.ts
    reason: 旧形式のオブジェクトと空白になった+の互換性を手で定義する。
