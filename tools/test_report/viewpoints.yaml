  - name: 共有
    guarantees: >-
      共有データの主な項目の往復と短縮・旧形式のリンクの読み込み、3 つのモードの共有リンクを開いたときの送信内容、壊れたリンクのエラーと戻り先、リンクのコピーと失敗時の再試行、画像の保存の操作を保証する。
    risks: >-
