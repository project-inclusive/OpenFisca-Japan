    - state:optional
  src/state/questionState.ts:
    - state:conversion
    - transition:forward
    - transition:back
    - transition:restore
  src/components/questions/question.tsx:
    - input:empty
    - transition:forward
    - transition:back
    - transition:restore
    - transition:save
    - transition:member
  src/components/top/topPage.tsx:
    - transition:consent
    - transition:forward
  src/components/TermsModal.tsx:
    - transition:consent
    - a11y:focus
  src/components/result/result.tsx:
    - sharing:roundtrip
    - sharing:invalid
    - sharing:copy
    - sharing:qr
    - sharing:image
  src/components/result/shareLink.ts:
    - sharing:roundtrip
    - sharing:legacy
    - sharing:invalid
  src/components/result/sharePresets.ts:
    - sharing:roundtrip
    - sharing:defaults
    - sharing:unknown
  src/components/layout/narrowWidth.tsx:
    - display:viewport
  src/components/calculate/calculate.ts:
    - state:conversion
  src/components/result/applicable.tsx:
    - display:present
    - display:absent
    - display:region
    - display:url
    - display:hiv

# タグのないテストを、ファイルと名前の正規表現で条件のタグに分類する（コードのタグとの和集合）。
