    reason: 説明文だけの部品、または起動入口のため対象外（2026-11-03 承認）。
  - target: file:src/components/questions/descriptions/spouseExistsButSingleParent.tsx
    cells:
      - '*'
    reason: 説明文だけの部品、または起動入口のため対象外（2026-11-03 承認）。
  - target: file:src/main.tsx
    cells:
      - '*'
    reason: 説明文だけの部品、または起動入口のため対象外（2026-11-03 承認）。
  - target: route:/privacypolicy
    cells:
      - '*'
    reason: 説明文だけのプライバシーポリシー画面は対象外（2026-11-03 承認）。
  - target: result:給付
    cells:
      - display:unit
      - display:hiv
    reason: 貸付の単位と窓口のHIV分岐は給付の責務ではない。
  - target: result:貸付
    cells:
      - display:range
      - display:hiv
    reason: 給付の最小最大と窓口のHIV分岐は貸付の責務ではない。
  - target: result:窓口
    cells:
      - display:range
      - display:unit
    reason: 給付の金額範囲と貸付の単位は窓口の責務ではない。
  - target: template:addressQuestionTemplate
    cells:
      - input:boundary
      - input:invalid
      - input:ime
      - input:mobile
    reason: 選択肢から回答する部品であり、自由入力・数値の境界・IME・数値入力属性を持たない。
  - target: template:selectionQuestionTemplate
    cells:
      - input:boundary
      - input:invalid
      - input:ime
      - input:mobile
    reason: 選択肢から回答する部品であり、自由入力・数値の境界・IME・数値入力属性を持たない。
  - target: template:multipleSelectionQuestionTemplate
    cells:
      - input:boundary
      - input:invalid
      - input:ime
      - input:mobile
    reason: 選択肢から回答する部品であり、自由入力・数値の境界・IME・数値入力属性を持たない。
  - target: template:yesNoQuestionTemplate
    cells:
      - input:boundary
      - input:invalid
      - input:ime
      - input:mobile
    reason: 選択肢から回答する部品であり、自由入力・数値の境界・IME・数値入力属性を持たない。
