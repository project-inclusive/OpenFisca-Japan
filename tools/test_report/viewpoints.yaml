      汎用・存在しない URL・応答エラーの 3 つの画面の表示と、モードごとの戻り先、キー操作を保証する。
      HTTP 500 と通信の失敗のときに応答エラーの画面へ移ること、3 つの幅で画面に収まることも確かめている。
