# テストのファイルごとの、確かめていること（verifies）と確かめていないこと（does_not_verify）。
# import・一覧・観点の件数とは独立した、assertion の受け持ち。
test_descriptions:
  src/state/questionState.test.ts:
    verifies: 決まった回答経路で目的の質問まで進み、値の保存・次の質問・戻る際の質問と回答と世帯員の復元、一部の分岐を確認する。
    does_not_verify: 画面表示、すべての回答経路・分岐の組合せ、入力値の妥当性。
  src/state/convert.test.ts:
    verifies: 主に回答を1項目ずつ設定し、contextから送信する世帯JSONの変数名・期間・単位換算・未回答の省略・世帯員追加・変換規則を確認する。
    does_not_verify: 複数回答の組合せ、バックエンドによる受理。
  src/state/progress.test.ts:
    verifies: 3モードの決まった時点で進捗の値や下限を確認する（最初は0、配偶者の最初は0.6以上など）。
    does_not_verify: 途中の全値、単調増加、最後に1になること。
  src/components/result/shareLink.test.ts:
    verifies: 共有データの主な項目の往復・短縮・旧形式、base64の可逆性と展開を確認する。
    does_not_verify: 全項目の一致、壊れたURL、画面操作。
  src/hooks/calculate.test.tsx:
    verifies: モックHTTPでPOSTのURL・本文・応答保存、未指定時の非送信、HTTP500・通信失敗と再試行を確認する。
    does_not_verify: 実バックエンド、全環境の送信先、ブラウザー表示。
  src/components/questions/template/questionTemplates.test.tsx:
    verifies: DOM上で年齢・金額・子の年齢と学年・人数の正規化と境界・未回答・復元・再描画を確認する。
    does_not_verify: 実ブラウザーのレイアウト、全質問への配線、OS固有IME。
  src/components/questions/template/questionTemplates.stories.tsx:
    verifies: 実ブラウザーで各テンプレートの入力・選択・復元・フォーカスと自動a11y検査を確認する。
    does_not_verify: 全質問の状態機械への配線、全端末、手動支援技術。
  src/components/questions/template/ageQuestionTemplate.browser.test.tsx:
    verifies: 実キーボードの下キーで年齢が0未満にならず、値と有効性とフォーカスを保つことを確認する。
    does_not_verify: 年齢の全境界、ほかのテンプレート、OS固有キー動作。
  src/components/layout/uiCompatibility.browser.test.tsx:
    verifies: 390・820・1440 CSS pxで質問・結果・3種のエラーの幅とキーボード操作、同意モーダルのフォーカス復帰を確認する。
    does_not_verify: モバイル実機のUA、全画面幅、状態機械との通し操作。
  src/components/errors/errors.stories.tsx:
    verifies: 汎用・404・応答エラーの表示、モード別の戻り先とキー操作、自動a11y検査を確認する。
    does_not_verify: 実HTTPでの発生、手動支援技術、すべてのエラー本文。
  src/components/result/result.stories.tsx:
    verifies: モック応答で給付・貸付の有無、地域・URL・金額幅・単位・HIVの表示分岐、HTTP500・通信失敗時の移動とa11yを確認する。
    does_not_verify: 実制度計算、全応答データ、全端末。
  e2e/Homepage.spec.ts:
    verifies: 5ブラウザー・端末設定でホームの見出しと2つの見積もりの入口の表示を確認する。
    does_not_verify: 実端末、すべてのルート、実API。
  e2e/SimpleCalculation.spec.ts:
    verifies: 5設定でかんたん見積もりの決まった回答経路からモック結果の表示までを確認する。
    does_not_verify: 全回答経路、実API・制度計算。
  e2e/DetailedCalculation.spec.ts:
    verifies: 5設定でくわしい見積もりの決まった回答経路からモック結果の表示までを確認する。
    does_not_verify: 全回答経路、災害モードの通し、実API・制度計算。
  e2e/visual/screens.spec.ts:
    verifies: 通常のE2Eの設定から外し、playwright.visual.config.tsでだけ実行する（この表の件数は0）。固定したDocker環境のChromiumで、13画面をdesktopとmobileの2幅で撮り、保存した期待値と画像・ARIAスナップショットが一致することを確認する。
    does_not_verify: 5ブラウザー・端末設定、操作の結果、期待値そのものの正しさ（撮影時にレビューする）。
  src/components/questions/template/questionTemplates.device.test.tsx:
    verifies: jsdomで8種の端末・ブラウザーのUAを与え、年齢・金額・子の年齢・人数の入力欄のtypeとpattern、IME変換中の値と回答の扱い、InputEventのない変更、未回答・復元・消去と0の再入力の有効性を確認する。
    does_not_verify: 実ブラウザー・実端末とOSのIME、レイアウト、状態機械への配線。
  src/components/questions/template/questionTemplates.input.browser.test.tsx:
    verifies: 実ブラウザーのキー操作で、年齢・金額・子の年齢の復元値を消して0を入れ直すこと、学年の編集から年齢への変換、金額欄のEnterでフォームを送らないこと、人数の「はい」でのフォーカスと値の復元を確認する。
    does_not_verify: IME、全端末、自動a11y検査、状態機械への配線。
  src/components/questions/question.browser.test.tsx:
    verifies: 実際の状態機械につないだ質問画面で、未回答と一部回答の阻止、次へ・前への回答の復元、配偶者・子ども・親の入力欄の切り替えと世帯員ごとの回答、3モードで最後の質問のあとに結果へ移り両方の世帯を保存することを確認する。
    does_not_verify: 結果の表示と計算の送信、すべての質問と回答経路、全端末。
  src/components/calculate/calculate.test.tsx:
    verifies: 3つの住所で困りごとごとに候補にする制度の一覧、前の結果の解除、複数の困りごとの組み合わせと再計算、選んだ日付の住所での地域の制度を確認する。
    does_not_verify: 制度を受けられるかの判定、バックエンドの計算、画面表示、ほかの地域。
  src/App.browser.test.tsx:
    verifies: Appのルート表で、2つの同意の確認と取り消し・閉じたときの解除、トップの説明とフッターのリンク、3モードの画面を直接開いて始めること、プライバシーポリシー・保存した結果のURL・応答エラー・存在しないURLの表示と戻り先を確認する。
    does_not_verify: 同意から結果までの通し（E2E）、実API、全端末。
  src/components/result/resultShare.browser.test.tsx:
    verifies: モック応答で、短縮・旧形式の共有リンクを3モードで開いた送信内容とQRのURL、壊れたリンクのエラーと戻り先、リンクのコピー、コピーの拒否と環境情報のコピーの再試行、画像保存と読み込み中の表示を確認する。
    does_not_verify: QRの画像そのもの、画像の中身、実際のクリップボードと実API。
  src/components/result/resultShare.stories.tsx:
    verifies: 実ブラウザーで、短縮の共有リンクの3モード、frontendのデータの有無による旧形式のリンク、壊れたリンクのエラーと戻り先を表示することを確認する。
    does_not_verify: 送信内容、コピー・QR・画像の操作、自動a11y検査での合否。
  src/components/result/resultDetails.browser.test.tsx:
    verifies: 社会福祉協議会の調べ方、窓口がない住所での非表示、3種の窓口の名前・地図・電話のリンクとWebサイトがないときの文字、金額が0のときに給付と貸付の欄を出さないことを確認する。
    does_not_verify: すべての住所と窓口のデータ、設定の値の正しさ、全端末。
  src/components/result/resultDetails.stories.tsx:
    verifies: 給付の金額の並びと単位、貸付の上限と区分、HIVの回答による拠点病院の表示、拠点病院の並びと重複の除去、注記つきの窓口と各リンクを確認する。
    does_not_verify: 実制度計算、すべての制度と窓口、自動a11y検査での合否。
  src/components/result/applicable.browser.test.tsx:
    verifies: 困りごとから候補にした制度の表示と説明・窓口、バックエンドとフロントの制度の統合と重複・偽の値の除外、結果がないときの非表示、HIVの回答による窓口、結果の都道府県による窓口、新しい結果での入れ替えを確認する。フロントの結果だけが変わったときの入れ替えは既知の失敗（it.fails）として残す。
    does_not_verify: 制度を受けられるかの判定、すべての制度と窓口、全端末。
# 段階ごとの全体の受け持ち。
responsibilities:
  - area: 状態の論理
    stages: unit
    scope: 質問の流れ・回答から世帯JSONへの変換・決まった時点の進捗・共有データ。
  - area: 表示・入力・操作
    stages: unit / ui
    scope: 入力テンプレート、モック応答の結果とエラー、幅・キー操作・自動a11y検査。
  - area: 通し
    stages: e2e
    scope: 5設定でホームとかんたん・くわしい見積もりの固定経路。APIはモック。

# qualities と features は docs/test_note.md の「機能ごとに保証していること」の正本（test_descriptions・responsibilities も使う）。
# 生成は python tools/test_report/report.py --write-test-note で行う。
#
# 機能をまたぐ品質の観点である。機能ではない。features の files で id を参照する。
qualities:
  - id: compatibility
    name: 互換
    description: 画面幅・ブラウザー・端末の違い。390・820・1440 CSS px の幅、jsdom で与えた UA、Playwright の 5 つの設定で確かめる。
  - id: a11y
    name: a11y
    description: キーボード操作・フォーカスと、story の自動 a11y 検査。自動の検査は違反を警告として報告するだけで、合否にしない。
  - id: visual
    name: 見た目
    description: 固定した Docker 環境の Chromium で、保存した期待値と画像・ARIA スナップショットを比べる。
  - id: journey
    name: 通しの操作
    description: 組み立てたアプリをブラウザーで開き、画面をまたいで操作する E2E。API はモックの応答を返す。
# アプリの機能（利用者が画面で使うもの）であり、テストのファイルのまとまりではない。
# - guarantees・risks は機能単位の結論だけを書く。ファイルごとの説明は test_descriptions から引き、ここには書かない。
# - risks は「テストが通っても本番で起こりうること」を、テストのファイルと設定から確かめられる事実で書く。
# - files は根拠のファイルである。文字列は機能そのものの振る舞いを確かめるファイル、
#   {file, qualities} はその機能についてどの品質の観点を確かめるかを示す。振る舞いも確かめる場合は behavior を並べる。
# - test_descriptions のファイルは、少なくとも1つの機能に置く（2つ以上の機能に置いてもよい）。
features:
  - name: トップと同意
    guarantees: >-
      トップの説明とフッターのリンク、2 つの同意がそろうまで見積もりを始められず、取り消しや閉じたときに同意が解除されること、3 つのモードの画面を直接開いて始められることを保証する。
      ホームの見出しと 2 つの見積もりの入口は、5 つのブラウザー・端末の設定で確かめている。
    risks: >-
      リンク先のページが開けることや内容は確かめない（確かめるのはリンクの行き先の値だけである）。
      プライバシーポリシーと説明文だけの部品は exclusions で対象外にしており、本文の誤りはテストで見つからない。
    files:
      - src/App.browser.test.tsx
      - { file: src/components/layout/uiCompatibility.browser.test.tsx, qualities: [a11y] }
      - { file: e2e/Homepage.spec.ts, qualities: [journey, compatibility] }
      - { file: e2e/visual/screens.spec.ts, qualities: [visual] }
  - name: 質問（3 つの見積もりモード）
    guarantees: >-
      かんたん・くわしく・地震被災者支援の 3 つのモードで、実際の状態機械につないだ質問画面が、未回答では進まず、次へ・前へで回答を復元し、世帯員ごとに入力欄を切り替えること、3 つのモードとも最後の質問のあとに結果へ移って世帯を保存することを保証する。
      進捗は決まった時点の値と下限だけを確かめている。
    risks: >-
      確かめているのは決まった回答経路だけであり、ほかの回答の組み合わせで質問が飛ぶ・行き止まる不具合は本番で起こりうる。
      進捗が途中で戻る、最後に 1 にならない、といったことは確かめない。
      地震被災者支援のモードは、同意から結果までを E2E で通していない。
    files:
      - src/state/questionState.test.ts
      - src/state/progress.test.ts
      - src/components/questions/question.browser.test.tsx
      - src/App.browser.test.tsx
      - { file: src/components/layout/uiCompatibility.browser.test.tsx, qualities: [compatibility, a11y] }
      - { file: e2e/SimpleCalculation.spec.ts, qualities: [journey, compatibility] }
      - { file: e2e/DetailedCalculation.spec.ts, qualities: [journey, compatibility] }
      - { file: e2e/visual/screens.spec.ts, qualities: [visual] }
  - name: 入力欄
    guarantees: >-
      年齢・金額・子の年齢と学年・人数の入力欄で、値の正規化と境界、未回答、回答の復元と消してからの入れ直しを保証する。
      実ブラウザーのキー操作とフォーカス、端末ごとの UA での type と pattern、IME の変換中のイベントの扱いも確かめている。
    risks: >-
      実機の端末と OS の IME・キー動作で値が崩れる、確定できない、といったことは起こりうる（UA は jsdom で与えただけ、IME はイベントを作って確かめただけである）。
      選択式の入力欄（住所・選択肢・複数選択・はい/いいえ）は、自由入力・数値の境界・IME を確かめない。
    files:
      - src/components/questions/template/questionTemplates.test.tsx
      - src/components/questions/template/ageQuestionTemplate.browser.test.tsx
      - { file: src/components/questions/template/questionTemplates.input.browser.test.tsx, qualities: [behavior, a11y] }
      - { file: src/components/questions/template/questionTemplates.stories.tsx, qualities: [behavior, a11y] }
      - { file: src/components/questions/template/questionTemplates.device.test.tsx, qualities: [compatibility] }
      - { file: e2e/SimpleCalculation.spec.ts, qualities: [journey, compatibility] }
      - { file: e2e/DetailedCalculation.spec.ts, qualities: [journey, compatibility] }
      - { file: e2e/visual/screens.spec.ts, qualities: [visual] }
  - name: 計算の依頼
    guarantees: >-
      回答から送る世帯 JSON の変数名・期間・単位換算・未回答の省略と、POST の送信先と本文、応答の保存を保証する。
      HTTP 500 と通信の失敗の扱いと再試行、失敗したときにエラーの画面へ移ること、困りごとごとにフロントエンドで候補にする制度の一覧も確かめている。
    risks: >-
      バックエンドが送った世帯 JSON を受け付けるか、応答の形が画面の読む形と一致するかは確かめない。API の形が変わると、テストが通ったまま本番で結果が出ない・誤って出ることが起こりうる。
      世帯 JSON への変換は主に回答を 1 項目ずつ確かめており、複数の回答の組み合わせは確かめない。本番の送信先の設定も確かめない。
    files:
      - src/state/convert.test.ts
      - src/hooks/calculate.test.tsx
      - src/components/calculate/calculate.test.tsx
      - src/components/result/result.stories.tsx
      - { file: e2e/SimpleCalculation.spec.ts, qualities: [journey, compatibility] }
      - { file: e2e/DetailedCalculation.spec.ts, qualities: [journey, compatibility] }
  - name: 結果（給付・貸付・窓口）
    guarantees: >-
      モックの応答に対して、給付・貸付・窓口の欄の有無、地域・URL・金額の幅・単位・HIV の回答による表示の分かれ方と、バックエンドとフロントエンドの制度の統合と重複の除外を保証する。
    risks: >-
      給付・貸付の金額と、制度を受けられるかの判定が正しいことは保証しない。応答は画面が読む形に合わせた手作りのデータであり、計算はバックエンドのテストに任せている。
      すべての制度と窓口のデータも確かめない。既知の不具合として、フロントエンドの計算結果だけが変わったときに表示する制度が入れ替わらない（it.fails で残している）。
