- name: 高等教育の修学支援新制度_減免割合
  label: 高等教育の修学支援新制度において世帯の所得により定まる授業料等の減免割合
  documentation: "大学等における修学の支援に関する法律施行令（https://laws.e-gov.go.jp/law/501CO0000000049）\n第2条第1項第2号イからハに定める減免の割合。減免額算定基準額に応じて全額、3分の2、3分の1となる。\n\n令和7年4月1日からは、多子世帯（3人以上の子等の生計を維持する者に生計を維持されている場合）は\n所得にかかわらず上限額まで全額となる。これは1つの条文には書かれておらず、\n大学等における修学の支援に関する法律（https://laws.e-gov.go.jp/law/501AC0000000008）\nと上記施行令の次の3つを合わせて読んだ結果である。\n\n- 法第4条第1項第1号: 多子世帯であることが認定事由の1つ\n  （「当該学生が三人以上の子等の生計を維持する者に生計を維持されている子等であること」）\n- 法第4条第2項第1号: 第1項第1号に該当する者の減免額は「確認大学等の種別その他の事情を\n  考慮して政令で定める額」。収入の状況を考慮すると定める同項第2号とは異なり、収入を考慮しない\n- 施行令第2条第1項第1号: その額は授業料の年額および入学金の額（それぞれ上限額まで）。\n  同項第2号のような3分の2・3分の1・4分の1の区分がない\n\n文部科学省も「令和7年度から、多子世帯の学生に対し所得制限なく、国が定める一定額まで、\n大学等の授業料・入学金の減免を行っております」と説明している。\nhttps://www.mext.go.jp/a_menu/koutou/hutankeigen/index.htm\n\n中間所得世帯に対する4分の1の減免（施行令第2条第1項第2号ニ）は、多子世帯または私立の理工農系の\n学部等に在学する学生に限られるため、この変数には含めていない。\nこの限定は施行令および施行規則には規定がなく、文部科学省の「令和6年度からは、対象を\n世帯年収約600万（目安）までの世帯のうち、子供3人以上を扶養する多子世帯や私立理工農系の\n学部・学科に通う学生について対象を拡充しました」という説明による。\nhttps://www.mext.go.jp/a_menu/koutou/hutankeigen/index.htm\n\n「特に優れた者」という学業成績等の要件、および資産に関する要件は判定していない。"
  references:
  - https://laws.e-gov.go.jp/law/501CO0000000049
  entity: 世帯
  value_type: float
  possible_values: []
  definition_period: day
  default_value: 0
  unit: null
  computed: true
  formula_start_dates:
  - '0001-01-01'
  todos: []
