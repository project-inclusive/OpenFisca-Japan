- name: 母子父子寡婦福祉資金貸付金_修学資金_最小
  label: 母子父子寡婦福祉資金貸付金の修学資金（月額）の最小額
  documentation: '母子及び父子並びに寡婦福祉法施行令第7条第3号（母子）、第31条の5第3号（父子）、

    第36条第3号（寡婦）に定める修学資金について、令和2年3月30日子家発0330第1号の別表1が

    定める学校等種別ごとの貸付限度額（月額）。金額は全国一律。


    高等学校に就学する児童について、自宅から通学する場合の額を最小額としている。


    以下は割り切って実装していない。

    - 大学・大学院・高等専門学校・専修学校に就学する場合の修学資金は、就学先を入力できないため未算出。

    - 自宅通学か自宅外通学かを入力できないため、自宅通学の額を最小額、自宅外通学の額を最大額としている。

    - 高校運営種別が未入力の場合は、国公立の額を最小額、私立の額を最大額としている。

    - 18歳到達により児童扶養手当を受けられなくなった児童に対する加算は未算出。

    - 給付型奨学金や授業料の減免を受けられる場合の控除は、大学等の修学資金にのみ関わるため未実装。

    - 貸付は就学期間中の月額であり、実際の貸付額は必要な額の範囲内で決まる。'
  references:
  - https://www.mhlw.go.jp/web/t_doc?dataId=00tc4886&dataType=1&pageNo=1
