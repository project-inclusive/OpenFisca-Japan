- name: 高等教育の修学支援新制度_減免割合_世帯員
  label: 高等教育の修学支援新制度において世帯員ごとに定まる授業料等の減免割合
  documentation: '世帯の所得により定まる減免割合に、4分の1の減免（施行令第2条第1項第2号ニ）を加えたもの。


    4分の1の減免は減免額算定基準額が3分の1の減免の上限以上、4分の1の減免の上限未満の範囲

    （令和6年度に追加）で、かつ多子世帯または私立の理工農系の学部等に在学する学生に限られる。

    在学する学部等は世帯員ごとに異なるため、世帯ではなく世帯員ごとに算出している。


    全額から3分の1までの減免に該当する場合は、そちらが適用される。'
