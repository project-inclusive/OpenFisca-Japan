- name: 母子父子寡婦福祉資金貸付金_就学支度資金_最小
  label: 母子父子寡婦福祉資金貸付金の就学支度資金の最小額
  documentation: "母子及び父子並びに寡婦福祉法施行令第7条第11号（母子）、第31条の5第11号（父子）、\n第36条第11号（寡婦）に定める就学支度資金について、令和2年3月30日子家発0330第1号が\n定める学校種別ごとの貸付限度額。金額は全国一律。\n\n高等学校に入学する児童について、自宅から通学する場合の額を最小額としている。\n\n以下は割り切って実装していない。\n- 小学校・中学校への入学に係る就学支度資金は、同令が「特に経済的に困難な事情にある」ことを\n  要件としており入力から判定できないため、最小額には含めず最大額にのみ含めている。\n- 大学・大学院・高等専門学校・専修学校（専門課程・専攻科）への入学、修業施設への入所に係る\n  就学支度資金は、進学先を入力できないため未算出。\n- 自宅通学か自宅外通学かを入力できないため、自宅通学の額を最小額、自宅外通学の額を最大額としている。\n- 高校運営種別が未入力の場合は、国公立の額を最小額、私立の額を最大額としている。\n- 入学の年度を入力できないため、小学1年生・中学1年生・高校1年生である間を入学時とみなしている。\n- 入学金の減免を受けられる場合の控除は、大学等の就学支度資金にのみ関わるため未実装。"
