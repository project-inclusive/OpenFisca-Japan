- name: 就学援助の対象者がいる
  label: 就学援助の対象者がいるか否か
  documentation: "学校教育法第19条に基づき、経済的理由によって就学困難と認められる学齢児童生徒の保護者に対して\n市町村が行う援助。対象者は生活保護法第6条第2項に規定する要保護者と、\n市町村教育委員会が要保護者に準ずる程度に困窮していると認める準要保護者の2種類。\n\n以下は割り切って実装している。\n- 要保護者であるかどうかは「生活保護の算出額が0円より大きい」ことで判定している。\n  実際の要保護者の認定は福祉事務所等が行う。\n- 準要保護者（令和6年度 約109万人）は判定していない。準要保護者に対する就学援助は\n  平成17年度に国庫補助が廃止され各市町村が単独で実施しており、認定基準を各市町村が\n  規定しているため。生活保護の基準額に係数を掛けて認定基準とする市町村が多いが、\n  係数も基準額の根拠とする扶助の種類も市町村により異なる。\n  したがって、この変数がfalseであっても市町村の基準では対象となる場合がある。\n- 支給される品目（学用品費、修学旅行費、学校給食費等）と金額は市町村により異なるため\n  算出していない。なお生活保護を受給している世帯は学用品費等を教育扶助で受給しているため、\n  就学援助として支給されるのは修学旅行費や医療費等に限られる\n  （要保護児童生徒援助費補助金交付要綱 別記1）。"
  references:
  - https://www.mext.go.jp/a_menu/shotou/career/05010502/017.htm
  entity: 世帯
  value_type: bool
  possible_values: []
  definition_period: day
  default_value: false
  unit: null
  computed: true
  formula_start_dates:
  - '0001-01-01'
  todos: []
  role: 制度
  institution: 就学援助
  category: 福祉
  subcategory: 育児/就学援助
