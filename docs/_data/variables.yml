- name: 母子父子寡婦福祉資金貸付金の対象者がいる
  label: 母子父子寡婦福祉資金貸付金の貸付対象者がいるか否か
  documentation: "母子及び父子並びに寡婦福祉法第13条（母子福祉資金）、第31条の6（父子福祉資金）、\n第32条（寡婦福祉資金）に基づく貸付制度。\n\n貸付対象は「配偶者のない女子（男子）で現に児童を扶養しているもの」および「寡婦」。\n「児童」は同法第6条第3項により20歳未満の者を指す。\n\n以下は割り切って実装していない。\n- 「寡婦」は既存の同名Variable（所得税法上の定義）を利用しているため、同法第6条第4項の\n  「かつて配偶者のない女子として児童を扶養していたことのあるもの」という要件は判定していない。\n- 母子・父子福祉団体に対する貸付は世帯を対象とする制度ではないため対象外。\n- 実際に貸付を受けられるかどうかは都道府県等の窓口による審査（償還の見込み、連帯保証人の有無等）\n  によって決まるため、ここでは法令上の対象者の範囲のみを判定している。"
