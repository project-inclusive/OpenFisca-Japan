- name: 高等教育の修学支援新制度_授業料等減免_最小
  label: 高等教育の修学支援新制度による授業料等減免の最小額
  documentation: "大学等における修学の支援に関する法律第4条に基づく授業料等の減免額。\n入学時以外は入学金の減免が行われないため、授業料の減免額のみを最小額としている。\n\n以下は割り切って実装している。\n- 夜間の課程および通信による教育は、入力から判別できないため昼間の課程として算出している\n  （夜間の課程と通信教育の減免上限額は昼間の課程より低い）。\n- 減免を受けられる期間（正規の修業年限）の判定は行っていない。\n- 授業料または入学金の実額が減免上限額を下回る場合は実額が上限となるが、\n  実額を入力できないため上限額で算出している。\n- 独立行政法人日本学生支援機構が行う給付型奨学金（学資支給金）は算出していない。"
  references:
  - https://laws.e-gov.go.jp/law/501CO0000000049
  entity: 世帯
  value_type: float
  possible_values: []
  definition_period: day
  default_value: 0
