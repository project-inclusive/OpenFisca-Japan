- name: 生活保護を受給可能でも小学校入学前の子しかいない場合は対象外
  period: 2026-04-01
  input:
    世帯:
      親一覧:
        - 自分
      子一覧:
        - 子
      生活保護: 1 # 生活保護受給可能性あり
