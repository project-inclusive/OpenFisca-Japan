- name: 小学生の子がいても生活保護を受給できない場合は対象外
  period: 2026-04-01
  input:
    世帯:
      親一覧:
        - 自分
      子一覧:
        - 子
      生活保護: 0 # 生活保護受給可能性なし
    世帯員:
      自分:
        年齢: 40
      子:
        年齢: 8
        学年: 3
  output:
    就学援助の対象者がいる: false

- name: 高校生と小学生の子がいる場合は小学生を理由に対象
  period: 2026-04-01
  input:
    世帯:
      親一覧:
        - 自分
      子一覧:
        - 子1
        - 子2
      生活保護: 1 # 生活保護受給可能性あり
    世帯員:
      自分:
        年齢: 40
      子1:
        年齢: 16
        学年: 11
      子2:
        年齢: 8
        学年: 3
  output:
    就学援助の対象者がいる: true

- name: 複数世帯を同時に計算できる
  period: 2026-04-01
  input:
    世帯一覧:
      世帯1:
        親一覧:
          - 自分1
        子一覧:
          - 子1
        生活保護: 1 # 生活保護受給可能性あり
      世帯2:
        親一覧:
          - 自分2
        子一覧:
          - 子2
        生活保護: 0 # 生活保護受給可能性なし
    世帯員:
      自分1:
        年齢: 40
      子1:
        年齢: 8
        学年: 3
      自分2:
        年齢: 40
      子2:
        年齢: 8
        学年: 3
  output:
    世帯一覧:
      世帯1:
        就学援助の対象者がいる: true
      世帯2:
        就学援助の対象者がいる: false
