# NOTE: 生活保護は計算式が複雑なため決め打ちでinputに指定（生活保護の額はそれ自体のユニットテストで担保）

- name: 生活保護を受給可能で小学生の子がいる場合は対象
  period: 2026-04-01
  input:
    世帯:
      親一覧:
        - 自分
      子一覧:
        - 子
      生活保護: 1 # 生活保護受給可能性あり
    世帯員:
      自分:
        年齢: 40
      子:
        年齢: 8
        学年: 3
  output:
    就学援助の対象者がいる: true

- name: 生活保護を受給可能で中学3年生の子がいる場合は対象
  period: 2026-04-01
