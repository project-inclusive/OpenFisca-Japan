      自分:
        年齢: 40
      子:
        年齢: 15
        学年: 9
  output:
    就学援助の対象者がいる: true

- name: 生活保護を受給可能でも高校生の子しかいない場合は対象外
  period: 2026-04-01
  input:
    世帯:
      親一覧:
        - 自分
      子一覧:
        - 子
      生活保護: 1 # 生活保護受給可能性あり
    世帯員:
      自分:
        年齢: 40
      子:
        年齢: 16
        学年: 11
