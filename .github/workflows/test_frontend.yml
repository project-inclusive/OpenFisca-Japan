name: Test Frontend

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: 26.4.0
      - name: Install packages
        run: npm ci
        working-directory: ./dashboard
      - name: ESLint
        run: npm run lint
        working-directory: ./dashboard
      - name: Prettier
        run: npm run pretty:check
        working-directory: ./dashboard
      - name: Unittest
        run: npm run test
        working-directory: ./dashboard
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: ./dashboard
      - name: Storybook and Browser Mode
        run: npm run test:ui
        working-directory: ./dashboard
      - name: Build Storybook
        run: npm run build-storybook
        working-directory: ./dashboard
      - name: Build
        run: npm run build
        working-directory: ./dashboard
      - name: Playwright smoke
        run: npm run test:e2e
        working-directory: ./dashboard

  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: dashboard
    env:
      HUSKY: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install packages
        run: npm ci
      - name: Check Playwright version
        run: node -e "require('node:assert/strict').equal(require('@playwright/test/package.json').version, '1.64.1')"
      - name: Build
        run: npm run build
      - name: Compare visual and ARIA snapshots
        run: npx --no-install playwright test --config playwright.visual.config.ts
      - name: Upload visual differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-differences
          path: tmp/playwright-visual/
          if-no-files-found: warn
          retention-days: 14
